<!DOCTYPE html>
<html>

<head>

    <title>Register | MediConnect</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🩺 MediConnect
        </div>

        <div class="nav-links">

            <a href="/">
                Login
            </a>

        </div>

    </nav>


    <section class="login-container">

        <div class="intro">

            <h1>
                Join<br>
                MediConnect.
            </h1>

            <p>
                Create your account to access secure
                telemedicine consultation services.
            </p>

        </div>


        <div class="card">

            <h2>Create Account</h2>

            <p class="card-subtitle">
                Register to continue
            </p>


            <form method="POST">

                <div class="form-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter your full name"
                        required>

                </div>


                <div class="form-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Create a password"
                        required>

                </div>


                <div class="form-group">

                    <label>Select Role</label>

                    <select name="role">

                        <option value="Patient">
                            Patient
                        </option>

                        <option value="Doctor">
                            Doctor
                        </option>

                        <option value="Admin">
                            Admin
                        </option>

                    </select>

                </div>


                <button class="btn" type="submit">

                    Create Account

                </button>

            </form>


            <p class="bottom-text">

                Already have an account?

                <a href="/">
                    Login
                </a>

            </p>

        </div>

    </section>

</body>

</html>
